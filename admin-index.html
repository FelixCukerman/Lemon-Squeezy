<!doctype html>
<html lang="uk">
  <head>
    <script defer src="cache-init.js?v=2.3.36"></script>
    <meta charset="utf-8" />
    <link rel="icon" type="image/png" href="assets/images/lemonade-logo.png" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Пошуковий індекс | LemonSqueezy</title>
    <link rel="stylesheet" href="css/style.css" />
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
    <script src="js/config/firebase.js"></script>
    <script src="js/app/search-index.js"></script>
    <script defer src="js/app/ui-effects.js"></script>
  </head>
  <body>
    <header class="top">
      <nav class="shell nav">
        <a class="logo" href="index.html"
          ><img
            class="lemon-logo-mark"
            src="assets/images/lemonade-logo.png"
            alt=""
            width="38"
            height="38"
          />LemonSqueezy.</a
        ><a href="admin.html">Адміністрування</a
        ><a href="recipes.html">Каталог</a>
      </nav>
    </header>
    <main class="shell section">
      <h1>Пошуковий індекс</h1>
      <p>
        Адміністратор може перебудувати індекс та безпечно прибрати застарілі
        маркери. Операція читає всі опубліковані рецепти (до 5 000). Не закривай
        вкладку до завершення.
      </p>
      <p id="who">Перевірка авторизації…</p>
      <button id="rebuild" disabled>Перебудувати та очистити маркери</button>
      <p id="progress" role="status"></p>
    </main>
    <script>
      const b = document.getElementById("rebuild"),
        p = document.getElementById("progress");
      auth.onAuthStateChanged(async (u) => {
        b.disabled = true;
        if (!u) {
          document.getElementById("who").textContent =
            "Увійди до акаунта адміністратора.";
          return;
        }
        try {
          const a = await db.collection("admins").doc(u.uid).get();
          document.getElementById("who").textContent = a.exists
            ? "Адміністратор: " + u.email
            : "Немає прав адміністратора";
          b.disabled = !a.exists;
        } catch (e) {
          p.textContent = e.message;
        }
      });
      b.onclick = async () => {
        b.disabled = true;
        try {
          const result = await LS_SEARCH_INDEX.rebuild(
            (t) => (p.textContent = t),
            true,
          );
          p.textContent =
            "Готово. В індексі " +
            result.count +
            " рецептів, прибрано " +
            result.removed +
            " старих маркерів.";
        } catch (e) {
          p.textContent = "Помилка: " + e.message;
        } finally {
          b.disabled = false;
        }
      };
    </script>
  </body>
</html>
